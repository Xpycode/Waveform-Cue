name: WaveformCue
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  CueCore:
    path: Packages/CueCore
  zPackages:
    path: ../../zPackages
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: FDMSRXXN73
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "17"
targets:
  WaveformCue:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    dependencies:
      - package: CueCore
      - package: zPackages
        product: AppShellKit
      - package: zPackages
        product: ProcessKit
    settings:
      base:
        PRODUCT_NAME: Waveform Cue
        PRODUCT_BUNDLE_IDENTIFIER: com.lucesumbrarum.WaveformCue
        INFOPLIST_FILE: Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    postBuildScripts:
      - name: Bundle FFmpeg
        script: '"$SRCROOT/Scripts/bundle-ffmpeg.sh"'
        basedOnDependencyAnalysis: false
